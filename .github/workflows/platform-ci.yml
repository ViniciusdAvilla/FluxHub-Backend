name: Backend platform tests
on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/test_platform.py"
      - "tests/test_api_auth.py"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main, migration/postgresql-sole-database-20261020]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:////tmp/fluxhub-platform-tests.db
      BACKEND_TOKEN: test_service_token_aaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_SECRET_KEY: test_jwt_secret_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - run: python -m pytest -q tests/test_api_auth.py tests/test_platform.py
